<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Temporary Email</title>

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script>
"use strict";

const ICON_PATHS = {
  mail: '<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>',
  refresh: '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
  copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check: '<polyline points="20 6 9 17 4 12"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  bell: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>',
  bellOff: '<path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/>',
  alert: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  chevronLeft: '<polyline points="15 18 9 12 15 6"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>',
  sparkles: '<path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/><path d="M19 16l.7 2.1L22 19l-2.3.9L19 22l-.7-2.1L16 19l2.3-.9L19 16z"/>',
};

function icon(name, opts) {
  opts = opts || {};
  const size = opts.size || 18;
  const className = opts.className || "";
  return (
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
    'class="' + className + '">' + ICON_PATHS[name] + "</svg>"
  );
}

const INBOX_LIFETIME_SECONDS = 10 * 60;
const INTERSTITIAL_COOLDOWN_MS = 60 * 1000;

function esc(str) {
  const div = document.createElement("div");
  div.textContent = String(str || "");
  return div.innerHTML;
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  return m + ":" + s;
}

const state = {
  dark: false,
  address: "Generating...",
  secondsLeft: INBOX_LIFETIME_SECONDS,
  messages: [],
  selectedMsg: null,
  copiedAddress: false,
  notificationsOn: true,
  showSettings: false,
  showPrivacy: false,
  showTerms: false,
  showInterstitial: false,
  interstitialCanClose: false,
  isRefreshing: false,
  toast: null,
  isOnline: typeof navigator !== "undefined" ? navigator.onLine : true,
  adConsent: null,
  showConsentPrompt: true,
};

let lastInterstitialAt = 0;

function setState(patch) {
  Object.assign(state, patch);
  render();
}

// Fetch real email from 1secmail API
async function newAddress() {
  setState({ isRefreshing: true, address: "Generating..." });
  try {
    const res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
    const data = await res.json();
    state.address = data[0];
  } catch (err) {
    const rand = Math.floor(Math.random() * 89999 + 10000);
    state.address = `user${rand}@1secmail.com`;
  }

  state.secondsLeft = INBOX_LIFETIME_SECONDS;
  state.messages = [];
  state.selectedMsg = null;
  state.isRefreshing = false;

  const now = Date.now();
  if (state.adConsent !== null && now - lastInterstitialAt > INTERSTITIAL_COOLDOWN_MS) {
    lastInterstitialAt = now;
    state.showInterstitial = true;
    state.interstitialCanClose = false;
    setTimeout(function () { setState({ interstitialCanClose: true }); }, 3000);
  }
  render();
  fetchInbox();
}

async function fetchInbox() {
  if (!state.address || state.address === "Generating...") return;
  const [login, domain] = state.address.split('@');
  
  try {
    const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${login}&domain=${domain}`);
    const msgs = await res.json();
    
    if (Array.isArray(msgs)) {
      const prevCount = state.messages.length;
      state.messages = msgs;
      if (msgs.length > prevCount && state.notificationsOn) {
        state.toast = "New email received!";
        setTimeout(() => setState({ toast: null }), 3000);
      }
    }
  } catch (e) {}
  setState({ isRefreshing: false });
}

async function openMessage(msgId) {
  const [login, domain] = state.address.split('@');
  try {
    const res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${login}&domain=${domain}&id=${msgId}`);
    const mail = await res.json();
    setState({ selectedMsg: mail });
  } catch (e) {
    setState({ toast: "Failed to load message body" });
    setTimeout(() => setState({ toast: null }), 2000);
  }
}

function copyAddress() {
  navigator.clipboard.writeText(state.address).then(() => {
    setState({ copiedAddress: true });
    setTimeout(() => setState({ copiedAddress: false }), 1500);
  });
}

function closeDetail() { setState({ selectedMsg: null }); }
function openSettings() { setState({ showSettings: true }); }
function closeSettings() { setState({ showSettings: false }); }
function openPrivacy() { setState({ showPrivacy: true }); }
function closePrivacy() { setState({ showPrivacy: false }); }
function openTerms() { setState({ showTerms: true }); }
function closeTerms() { setState({ showTerms: false }); }
function toggleNotifications() { setState({ notificationsOn: !state.notificationsOn }); }
function toggleDark() { setState({ dark: !state.dark }); }
function closeInterstitial() { setState({ showInterstitial: false }); }
function chooseConsent(p) { setState({ adConsent: p, showConsentPrompt: false }); }

function deleteData() {
  setState({ messages: [], selectedMsg: null, toast: "Inbox cleared" });
  setTimeout(() => setState({ toast: null }), 2000);
}

// Automatic Polling & Timers
setInterval(() => {
  if (state.secondsLeft > 0) {
    state.secondsLeft -= 1;
    render();
  }
}, 1000);

setInterval(() => {
  if (state.secondsLeft > 0) fetchInbox();
}, 8000);

// Initial Load
newAddress();

function render() {
  const s = state;
  const expired = s.secondsLeft <= 0;

  const t = {
    bg: s.dark ? "bg-slate-950" : "bg-slate-50",
    surface: s.dark ? "bg-slate-900" : "bg-white",
    border: s.dark ? "border-slate-800" : "border-slate-200",
    text: s.dark ? "text-slate-100" : "text-slate-900",
    subtext: s.dark ? "text-slate-400" : "text-slate-500",
  };

  const urgency = s.secondsLeft <= 30 ? "text-rose-500" : s.secondsLeft <= 120 ? "text-amber-500" : "text-blue-600";

  const toastHtml = s.toast
    ? '<div class="absolute top-3 left-1/2 -translate-x-1/2 z-30 px-4 py-2 rounded-full bg-blue-600 text-white text-xs font-medium shadow-lg flex items-center gap-1.5">' +
      icon("bell", { size: 12 }) + " " + esc(s.toast) + "</div>" : "";

  const headerHtml =
    '<header class="px-5 pt-6 pb-4 border-b ' + t.border + " " + t.surface + '">' +
      '<div class="flex items-center justify-between mb-4">' +
        '<div class="flex items-center gap-2">' +
          '<div class="h-8 w-8 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">' + icon("mail", { size: 16 }) + "</div>" +
          '<span class="font-bold text-base tracking-tight ' + t.text + '">Temporary Email</span>' +
        "</div>" +
        '<button onclick="openSettings()" class="h-10 w-10 flex items-center justify-center rounded-full ' + (s.dark ? "hover:bg-slate-800" : "hover:bg-slate-100") + '">' + icon("settings", { size: 19 }) + "</button>" +
      "</div>" +
      '<div class="rounded-2xl p-4 ' + (s.dark ? "bg-slate-800/60" : "bg-blue-50/70 border border-blue-100") + '">' +
        '<p class="text-xs mb-1 font-semibold text-blue-600 uppercase tracking-wider">Your Temp Address</p>' +
        '<div class="flex items-center justify-between gap-2">' +
          '<button onclick="copyAddress()" class="flex-1 text-left font-mono text-sm font-semibold ' + t.text + ' truncate active:opacity-60 min-h-[44px] flex items-center">' + esc(s.address) + "</button>" +
          '<button onclick="copyAddress()" class="h-10 w-10 shrink-0 flex items-center justify-center rounded-xl ' + (s.dark ? "bg-slate-700" : "bg-white border border-blue-200 text-blue-600 shadow-sm") + ' active:scale-95 transition">' +
            (s.copiedAddress ? icon("check", { size: 18, className: "text-blue-600" }) : icon("copy", { size: 18 })) +
          "</button>" +
        "</div>" +
        '<div class="flex items-center justify-between mt-3 pt-2 border-t border-blue-100/60">' +
          '<div class="flex items-center gap-2">' +
            '<span class="text-xl font-bold tabular-nums ' + urgency + '">' + (expired ? "00:00" : formatClock(s.secondsLeft)) + "</span>" +
            '<span class="text-xs ' + t.subtext + '">' + (expired ? "expired" : "time left") + "</span>" +
          "</div>" +
          '<button onclick="newAddress()" class="min-h-[40px] px-4 rounded-xl text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-sm bg-blue-600 active:bg-blue-700 active:scale-95">' +
            icon("refresh", { size: 14 }) + " New address" +
          "</button>" +
        "</div>" +
      "</div>" +
    "</header>";

  let mainInner = "";
  if (expired) {
    mainInner =
      '<div class="flex flex-col items-center text-center px-8 pt-16">' +
        '<div class="h-16 w-16 rounded-full flex items-center justify-center mb-4 ' + (s.dark ? "bg-slate-800" : "bg-blue-50 text-blue-600") + '">' + icon("alert", { size: 26, className: "text-amber-500" }) + "</div>" +
        '<p class="font-semibold mb-1 ' + t.text + '">Inbox expired</p>' +
        '<p class="text-xs mb-5 ' + t.subtext + '">Tap below to generate a new temporary address.</p>' +
        '<button onclick="newAddress()" class="min-h-[44px] px-5 rounded-xl bg-blue-600 text-white text-xs font-semibold shadow-md active:bg-blue-700">Get new address</button>' +
      "</div>";
  } else if (s.messages.length === 0) {
    mainInner =
      '<div class="flex flex-col items-center text-center px-8 pt-16">' +
        '<div class="h-16 w-16 rounded-full flex items-center justify-center mb-4 ' + (s.dark ? "bg-slate-800" : "bg-blue-50 text-blue-600") + '">' + icon("inbox", { size: 26 }) + "</div>" +
        '<p class="font-semibold mb-1 ' + t.text + '">Waiting for incoming mail...</p>' +
        '<p class="text-xs ' + t.subtext + '">Emails sent to your temporary address will appear here automatically.</p>' +
      "</div>";
  } else {
    mainInner =
      '<ul class="divide-y ' + t.border + '">' +
      s.messages.map(m => `
        <li><button onclick="openMessage('${m.id}')" class="w-full text-left px-5 py-3.5 flex items-start gap-3 min-h-[44px] ${s.dark ? 'active:bg-slate-800' : 'active:bg-slate-100'}">
          <div class="h-9 w-9 rounded-full shrink-0 flex items-center justify-center text-xs font-bold bg-blue-600 text-white">${esc((m.from || 'U').slice(0, 2).toUpperCase())}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
              <span class="text-sm truncate font-bold ${t.text}">${esc(m.from)}</span>
              <span class="text-[11px] shrink-0 ${t.subtext}">${esc(m.date)}</span>
            </div>
            <p class="text-xs truncate ${t.subtext}">${esc(m.subject || '(No Subject)')}</p>
          </div>
        </button></li>
      `).join("") +
      "</ul>";
  }

  const checkNowHtml = !expired
    ? '<button onclick="fetchInbox()" class="mx-4 mb-2 min-h-[40px] rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 ' + (s.dark ? "bg-slate-900 border border-slate-800 text-slate-300" : "bg-white border border-slate-200 text-slate-700 shadow-sm") + '">' +
        icon("refresh", { size: 13, className: s.isRefreshing ? "animate-spin" : "" }) + " " + (s.isRefreshing ? "Checking..." : "Refresh Inbox") +
      "</button>" : "";

  const bannerHtml = (s.adConsent !== null)
    ? '<div class="w-full flex items-center justify-between px-4 py-2 border-t text-xs ' + (s.dark ? "bg-slate-800 border-slate-700 text-slate-400" : "bg-slate-100 border-slate-200 text-slate-500") + '">' +
        '<span class="flex items-center gap-1.5">' + icon("sparkles", { size: 12, className: "opacity-70 text-blue-600" }) + " Ad Banner Space</span>" +
        '<span class="opacity-60 text-[10px]">AdMob</span>' +
      "</div>" : "";

  const footerHtml =
    '<footer class="px-5 py-2.5 flex items-center justify-center gap-4 text-[11px] border-t ' + t.border + " " + t.surface + " " + t.subtext + '">' +
      '<button onclick="openPrivacy()" class="hover:underline text-blue-600 font-medium">Privacy Policy</button>' +
      '<span>·</span>' +
      '<button onclick="openTerms()" class="hover:underline text-blue-600 font-medium">Terms of Service</button>' +
    "</footer>";

  function sheet(title, bodyHtml, closeFn) {
    return (
      '<div class="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/50 p-0 sm:p-4 backdrop-blur-xs">' +
        '<div class="w-full sm:max-w-lg sm:rounded-2xl rounded-t-2xl max-h-[85vh] flex flex-col shadow-2xl ' + (s.dark ? "bg-slate-900 text-slate-100" : "bg-white text-slate-900") + '">' +
          '<div class="flex items-center justify-between px-5 py-4 border-b ' + (s.dark ? "border-slate-800" : "border-slate-200") + '">' +
            '<h2 class="text-base font-bold">' + esc(title) + "</h2>" +
            '<button onclick="' + closeFn + '()" class="h-9 w-9 flex items-center justify-center rounded-full ' + (s.dark ? "hover:bg-slate-800" : "hover:bg-slate-100") + '">' + icon("x", { size: 20 }) + "</button>" +
          "</div>" +
          '<div class="overflow-y-auto px-5 py-4 text-xs leading-relaxed space-y-3">' + bodyHtml + "</div>" +
        "</div>" +
      "</div>"
    );
  }

  let detailHtml = "";
  if (s.selectedMsg) {
    const body =
      '<div class="flex items-center gap-2 mb-4">' +
        '<span onclick="closeDetail()" class="cursor-pointer p-1">' + icon("chevronLeft", { size: 18 }) + "</span>" +
        '<div><p class="text-sm font-bold ' + t.text + '">' + esc(s.selectedMsg.from) + "</p>" +
        '<p class="text-xs ' + t.subtext + '">' + esc(s.selectedMsg.date) + "</p></div>" +
      "</div>" +
      '<div class="p-3 rounded-xl mb-4 text-xs bg-slate-100 dark:bg-slate-800 overflow-x-auto text-slate-800 dark:text-slate-200 leading-relaxed">' +
        (s.selectedMsg.htmlBody || s.selectedMsg.textBody || 'No email content body available.') +
      "</div>";
    detailHtml = sheet(s.selectedMsg.subject || '(No Subject)', body, "closeDetail");
  }

  let settingsHtml = "";
  if (s.showSettings) {
    const body =
      '<div class="space-y-1">' +
        '<div class="flex items-center justify-between py-3 border-b ' + t.border + '">' +
          '<div class="flex items-center gap-2.5">' + icon(s.notificationsOn ? "bell" : "bellOff", { size: 17 }) + '<span class="text-xs font-medium">Notifications</span></div>' +
          '<button onclick="toggleNotifications()" class="w-11 h-6 rounded-full relative transition ' + (s.notificationsOn ? "bg-blue-600" : (s.dark ? "bg-slate-700" : "bg-slate-300")) + '">' +
            '<span class="absolute top-0.5 h-5 w-5 rounded-full bg-white transition ' + (s.notificationsOn ? "left-5" : "left-0.5") + '"></span>' +
          "</button>" +
        "</div>" +
        '<div class="flex items-center justify-between py-3 border-b ' + t.border + '">' +
          '<div class="flex items-center gap-2.5">' + icon(s.dark ? "moon" : "sun", { size: 17 }) + '<span class="text-xs font-medium">Dark mode</span></div>' +
          '<button onclick="toggleDark()" class="w-11 h-6 rounded-full relative transition ' + (s.dark ? "bg-blue-600" : "bg-slate-300") + '">' +
            '<span class="absolute top-0.5 h-5 w-5 rounded-full bg-white transition ' + (s.dark ? "left-5" : "left-0.5") + '"></span>' +
          "</button>" +
        "</div>" +
        '<div class="py-3"><button onclick="deleteData()" class="flex items-center gap-2.5 text-xs text-rose-500 font-semibold min-h-[44px]">' + icon("trash", { size: 17 }) + " Clear inbox</button></div>" +
      "</div>";
    settingsHtml = sheet("Settings", body, "closeSettings");
  }

  let privacyHtml = s.showPrivacy ? sheet("Privacy Policy", 
  '<p class="font-bold mb-1">Good Faith & Privacy Commitment</p>' +
  '<p>Temporary Email is provided in good faith as a privacy tool designed strictly to protect user personal email inboxes from unwanted spam, junk mail, and promotional clutter during simple sign-ups and code verifications.</p>' +
  '<p class="mt-2 font-bold mb-1">Data Retention</p>' +
  '<p>All temporary email addresses and incoming messages automatically self-destruct and are permanently purged after 10 minutes. We do not store, sell, harvest, or track any personal identifiers or email history.</p>', 
"closePrivacy") : "";

let termsHtml = s.showTerms ? sheet("Terms of Service", 
  '<p class="font-bold mb-1">Acceptable Use & Good Intent</p>' +
  '<p>By using Temporary Email, you agree to use this service exclusively for legitimate, temporary testing and sign-up verifications.</p>' +
  '<p class="mt-2 font-bold mb-1 text-rose-500">Strict Anti-Fraud Policy</p>' +
  '<p>This app must <strong>NEVER</strong> be used for illegal activities, spamming, phishing, scamming, unauthorized access, bypassing security systems, or fraudulent impersonation of any individual or organization.</p>' +
  '<p class="mt-2">We maintain a zero-tolerance policy for malicious activity. Any misuse of this service that violates local or international laws is strictly prohibited.</p>', 
"closeTerms") : "";
  let interstitialHtml = s.showInterstitial ? 
    '<div class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-6">' +
      '<div class="w-full max-w-xs rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 p-6 text-white relative shadow-2xl text-center">' +
        '<button onclick="closeInterstitial()" ' + (!s.interstitialCanClose ? "disabled" : "") + ' class="absolute top-3 right-3 h-8 w-8 rounded-full flex items-center justify-center ' + (s.interstitialCanClose ? "bg-black/40" : "bg-black/20 opacity-50") + '">' +
          (s.interstitialCanClose ? icon("x", { size: 16 }) : '3') +
        "</button>" +
        icon("sparkles", { size: 32, className: "mb-3 mx-auto" }) +
        '<h3 class="text-base font-bold mb-2">Ad Space</h3>' +
        '<p class="text-xs opacity-90">Interstitial Ad Placement</p>' +
      "</div>" +
    "</div>" : "";

  let consentHtml = s.showConsentPrompt ?
    '<div class="fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-4">' +
      '<div class="w-full sm:max-w-sm rounded-2xl p-5 ' + (s.dark ? "bg-slate-900 text-slate-100" : "bg-white text-slate-900") + '">' +
        '<h3 class="font-bold text-sm mb-2">Ad Consent</h3>' +
        '<p class="text-xs mb-4 opacity-80">This app remains free through advertising.</p>' +
        '<button onclick="chooseConsent(true)" class="w-full min-h-[44px] rounded-xl bg-blue-600 text-white text-xs font-bold mb-2">Allow Personalized Ads</button>' +
        '<button onclick="chooseConsent(false)" class="w-full min-h-[44px] rounded-xl text-xs font-semibold ' + (s.dark ? "bg-slate-800" : "bg-slate-100") + '">Non-personalized Only</button>' +
      "</div>" +
    "</div>" : "";

  document.getElementById("root").innerHTML = 
    '<div class="min-h-screen w-full flex items-center justify-center ' + (s.dark ? "bg-slate-950" : "bg-slate-200") + ' p-0 sm:p-6">' +
      '<div class="relative w-full sm:max-w-sm h-[100dvh] sm:h-[812px] sm:rounded-[2.5rem] overflow-hidden flex flex-col ' + t.bg + " " + t.text + " sm:shadow-2xl sm:border-8 " + (s.dark ? "sm:border-slate-800" : "sm:border-slate-900") + '">' +
        toastHtml + headerHtml + '<main class="flex-1 overflow-y-auto">' + mainInner + '</main>' + checkNowHtml + bannerHtml + footerHtml + detailHtml + settingsHtml + privacyHtml + termsHtml + interstitialHtml + consentHtml +
      "</div>" +
    "</div>";
}
</script>
</body>
