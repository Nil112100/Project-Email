<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Temp Mail</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- Top Header -->
  <header class="sticky top-0 z-50 glass-card px-5 py-4 border-b border-slate-800/80 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <i class="fa-solid fa-bolt text-lg text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white tracking-wide">Flash Mail</h1>
        <p class="text-[11px] text-slate-400 font-medium">Disposable Email Service</p>
      </div>
    </div>
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Active
    </span>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-4">

    <!-- Email Generator Card -->
    <div class="glass-card p-5 rounded-2xl shadow-xl flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <label class="text-xs font-semibold tracking-wider text-slate-400 uppercase flex items-center gap-1.5">
          <i class="fa-regular fa-envelope text-indigo-400"></i> Your Temp Address
        </label>
        <span id="status-text" class="text-[11px] text-slate-500">Auto-created</span>
      </div>

      <!-- Input + Copy Button -->
      <div class="relative flex items-center">
        <input 
          id="email-input" 
          type="text" 
          readonly 
          value="Generating..." 
          class="w-full bg-slate-900/90 text-indigo-300 font-mono text-sm pl-4 pr-24 py-3.5 rounded-xl border border-slate-700/60 focus:outline-none focus:border-indigo-500 transition-all shadow-inner"
        />
        <button 
          id="copy-btn"
          onclick="copyEmail()" 
          class="absolute right-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold text-xs px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 shadow-md shadow-indigo-600/30">
          <i class="fa-regular fa-copy"></i> <span id="copy-text">Copy</span>
        </button>
      </div>

      <!-- Generate New Email Button -->
      <button 
        onclick="generateNewEmail()" 
        class="w-full bg-gradient-to-r from-slate-800 to-slate-800/80 hover:from-slate-700 hover:to-slate-700/80 active:scale-[0.99] text-slate-200 font-semibold text-xs py-3 rounded-xl border border-slate-700/50 transition-all flex items-center justify-center gap-2 shadow">
        <i class="fa-solid fa-rotate text-slate-400"></i> Generate Random Email
      </button>
    </div>

    <!-- Inbox Card -->
    <div class="flex-1 glass-card p-5 rounded-2xl shadow-xl flex flex-col min-h-[320px]">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-inbox text-indigo-400"></i>
          <h2 class="text-sm font-bold text-slate-200">Inbox</h2>
        </div>
        <button 
          onclick="checkInbox()" 
          class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-arrows-rotate text-[11px]" id="refresh-icon"></i> Refresh
        </button>
      </div>

      <!-- Messages Container -->
      <div id="inbox-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
        <div class="h-full flex flex-col items-center justify-center text-center p-6">
          <div class="w-12 h-12 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500 mb-3 border border-slate-700/50">
            <i class="fa-regular fa-paper-plane text-xl"></i>
          </div>
          <p class="text-xs font-medium text-slate-400">Waiting for incoming emails...</p>
          <p class="text-[11px] text-slate-500 mt-1 max-w-[200px]">Send an email to your address above to see it here automatically.</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    let currentEmail = '';

    async function generateNewEmail() {
      const emailInput = document.getElementById('email-input');
      const statusText = document.getElementById('status-text');
      emailInput.value = 'Generating...';
      
      try {
        const res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
        const data = await res.json();
        currentEmail = data[0];
        emailInput.value = currentEmail;
        statusText.textContent = 'Active';
        checkInbox();
      } catch (err) {
        emailInput.value = 'demo-user@1secmail.com';
        currentEmail = 'demo-user@1secmail.com';
        statusText.textContent = 'Demo Mode';
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('email-input');
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      
      if (!emailInput.value || emailInput.value === 'Generating...') return;

      navigator.clipboard.writeText(emailInput.value);
      
      copyText.textContent = 'Copied!';
      copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
      
      setTimeout(() => {
        copyText.textContent = 'Copy';
        copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
      }, 2000);
    }

    async function checkInbox() {
      const inboxList = document.getElementById('inbox-list');
      const refreshIcon = document.getElementById('refresh-icon');
      if (!currentEmail || currentEmail === 'Generating...') return;

      refreshIcon.classList.add('fa-spin');

      const [username, domain] = currentEmail.split('@');
      
      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${username}&domain=${domain}`);
        const messages = await res.json();

        if (messages.length === 0) {
          inboxList.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-center p-6">
              <div class="w-12 h-12 rounded-full bg-slate-800/80 flex items-center justify-center text-slate-500 mb-3 border border-slate-700/50">
                <i class="fa-regular fa-paper-plane text-xl"></i>
              </div>
              <p class="text-xs font-medium text-slate-400">No emails received yet.</p>
              <p class="text-[11px] text-slate-500 mt-1">We automatically refresh your inbox.</p>
            </div>`;
        } else {
          inboxList.innerHTML = messages.map(msg => `
            <div class="p-3.5 bg-slate-900/90 hover:bg-slate-900 rounded-xl border border-slate-800 transition-all shadow-sm">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-xs text-indigo-300 truncate max-w-[180px]">${msg.from}</span>
                <span class="text-[10px] text-slate-500">${msg.date}</span>
              </div>
              <div class="text-xs font-semibold text-slate-200 mb-1">${msg.subject}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        inboxList.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Failed to fetch emails.</p>`;
      } finally {
        setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
      }
    }

    generateNewEmail();
    setInterval(checkInbox, 10000); // Auto-refresh inbox every 10 seconds
  </script>
</body>
</html>
