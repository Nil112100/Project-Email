<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporary Email</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #f1f5f9; color: #1e293b; }
        .app-shell { background-color: #ffffff; color: #1e293b; border-color: #cbd5e1; }
        .custom-box { background-color: #f8fafc; border-color: #e2e8f0; }
        .text-main { color: #0f172a !important; }
        .text-sub { color: #64748b !important; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col items-center justify-between m-0 p-0 sm:p-4" id="appBody">
    <!-- App Container -->
    <div id="root" class="w-full sm:max-w-md flex flex-col flex-grow items-center justify-center"></div>

    <script>
        // State management
        let s = {
            email: '',
            token: '',
            password: '',
            messages: [],
            selectedMessage: null,
            timeLeft: 600, // 10 minutes
            showPrivacy: false,
            showTerms: false,
            loading: false
        };

        let timerInterval = null;

        async function initEmail() {
            s.loading = true;
            render();
            try {
                const domainRes = await fetch('https://api.mail.tm/domains');
                const domainsData = await domainRes.json();
                const domain = domainsData['hydra:member'][0].domain;

                const username = 'user' + Math.random().toString(36).substring(2, 9);
                s.email = `${username}@${domain}`;
                s.password = 'Pass123_' + Math.random().toString(36).substring(2, 7);

                const createRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: s.email, password: s.password })
                });

                if (createRes.ok) {
                    const tokenRes = await fetch('https://api.mail.tm/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address: s.email, password: s.password })
                    });
                    const tokenData = await tokenRes.json();
                    s.token = tokenData.token;
                }
            } catch (err) {
                console.error("Failed to initialize mail.tm account", err);
            }
            s.loading = false;
            s.timeLeft = 600;
            s.messages = [];
            startTimer();
            render();
            fetchMessages();
        }

        async function fetchMessages() {
            if (!s.token) return;
            try {
                const res = await fetch('https://api.mail.tm/messages', {
                    headers: { 'Authorization': `Bearer ${s.token}` }
                });
                const data = await res.json();
                if (data['hydra:member']) {
                    s.messages = data['hydra:member'];
                    render();
                }
            } catch (err) {
                console.error("Error fetching messages", err);
            }
        }

        async function openMessage(id) {
            try {
                const res = await fetch(`https://api.mail.tm/messages/${id}`, {
                    headers: { 'Authorization': `Bearer ${s.token}` }
                });
                const msgData = await res.json();
                s.selectedMessage = msgData;
                render();
            } catch (err) {
                console.error("Error reading message", err);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (s.timeLeft > 0) {
                    s.timeLeft--;
                    renderTimer();
                } else {
                    initEmail();
                }
            }, 1000);
        }

        function renderTimer() {
            const el = document.getElementById('timerDisplay');
            if (el) {
                const mins = Math.floor(s.timeLeft / 60);
                const secs = s.timeLeft % 60;
                el.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')} left`;
            }
        }

        function copyEmail() {
            navigator.clipboard.writeText(s.email);
            alert("Email copied to clipboard!");
        }

        function render() {
            const root = document.getElementById('root');
            const mins = Math.floor(s.timeLeft / 60);
            const secs = s.timeLeft % 60;
            const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            let inboxContent = '';
            if (s.loading) {
                inboxContent = `<div class="text-center py-8 text-sm text-sub">Creating secure temporary mailbox...</div>`;
            } else if (s.messages.length === 0) {
                inboxContent = `
                    <div class="text-center py-12">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center mx-auto mb-3">
                            <i data-lucide="mail" class="w-6 h-6"></i>
                        </div>
                        <p class="font-medium text-sm text-main">Waiting for incoming mail...</p>
                        <p class="text-xs mt-1 text-sub">Emails sent to your temporary address will appear here automatically.</p>
                    </div>
                `;
            } else {
                inboxContent = `<div class="divide-y divide-slate-100">`;
                s.messages.forEach(m => {
                    inboxContent += `
                        <div onclick="openMessage('${m.id}')" class="py-3 px-2 flex items-center justify-between cursor-pointer hover:bg-slate-50 rounded-lg transition-colors">
                            <div class="truncate pr-2">
                                <p class="text-xs font-bold truncate text-main">${m.from.name || m.from.address}</p>
                                <p class="text-xs truncate text-sub">${m.subject || '(No Subject)'}</p>
                            </div>
                            <span class="text-[10px] text-sub whitespace-nowrap">${new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                    `;
                });
                inboxContent += '</div>';
            }

            // Professional email client formatting for the message body
            let emailBodyContent = '';
            if (s.selectedMessage) {
                if (s.selectedMessage.html && s.selectedMessage.html.length > 0) {
                    // Render rich HTML email securely inside an iframe
                    const safeHtml = s.selectedMessage.html[0].replace(/"/g, '&quot;');
                    emailBodyContent = `<iframe srcdoc="${safeHtml}" sandbox="allow-same-origin" class="w-full h-80 border-0 bg-white"></iframe>`;
                } else {
                    // Fallback to beautifully styled plain text
                    const plainText = s.selectedMessage.text || s.selectedMessage.intro || 'No content.';
                    emailBodyContent = `<div class="whitespace-pre-wrap text-slate-800 text-xs leading-relaxed font-sans">${plainText}</div>`;
                }
            }

            let messageModal = s.selectedMessage ? `
                <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div class="app-shell w-full max-w-lg rounded-2xl p-5 shadow-2xl border max-h-[90vh] flex flex-col">
                        <!-- Email Header info -->
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-sm truncate pr-2 text-main">${s.selectedMessage.subject || '(No Subject)'}</h3>
                            <button onclick="s.selectedMessage=null;render();" class="p-1 rounded-full hover:bg-slate-100 text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="py-3 text-xs border-b border-slate-100 text-sub bg-slate-50/50 px-3 rounded-lg my-2">
                            <p class="truncate"><strong>From:</strong> ${s.selectedMessage.from.name ? s.selectedMessage.from.name + ' &lt;' + s.selectedMessage.from.address + '&gt;' : s.selectedMessage.from.address}</p>
                            <p class="mt-1"><strong>Date:</strong> ${new Date(s.selectedMessage.createdAt).toLocaleString()}</p>
                        </div>
                        <!-- Email Body Reading Pane -->
                        <div class="flex-grow overflow-y-auto bg-white border border-slate-200 p-4 rounded-xl my-2 shadow-inner">
                            ${emailBodyContent}
                        </div>
                        <!-- Modal Footer -->
                        <div class="pt-3 border-t border-slate-100 text-right">
                            <button onclick="s.selectedMessage=null;render();" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-medium hover:bg-blue-700 transition-colors">Close</button>
                        </div>
                    </div>
                </div>
            ` : '';

            let privacyHtml = s.showPrivacy ? `
                <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div class="app-shell w-full max-w-md rounded-2xl p-6 shadow-2xl border max-h-[85vh] flex flex-col">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-sm text-main">Privacy Policy</h3>
                            <button onclick="s.showPrivacy=false;render();" class="p-1 rounded-full hover:bg-slate-100 text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="py-4 flex-grow overflow-y-auto text-xs space-y-2 text-sub">
                            <p class="font-bold mb-1 text-main">Good Faith & Privacy Commitment</p>
                            <p>Temporary Email is provided in good faith as a privacy tool designed strictly to protect user personal email inboxes from unwanted spam, junk mail, and promotional clutter during simple sign-ups and code verifications.</p>
                            <p class="mt-2 font-bold mb-1 text-main">Data Retention</p>
                            <p>All temporary email addresses and incoming messages automatically self-destruct and are permanently purged after 10 minutes. We do not store, sell, harvest, or track any personal identifiers or email history.</p>
                        </div>
                    </div>
                </div>
            ` : '';

            let termsHtml = s.showTerms ? `
                <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
                    <div class="app-shell w-full max-w-md rounded-2xl p-6 shadow-2xl border max-h-[85vh] flex flex-col">
                        <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                            <h3 class="font-bold text-sm text-main">Terms of Service</h3>
                            <button onclick="s.showTerms=false;render();" class="p-1 rounded-full hover:bg-slate-100 text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
                        </div>
                        <div class="py-4 flex-grow overflow-y-auto text-xs space-y-2 text-sub">
                            <p class="font-bold mb-1 text-main">Acceptable Use & Good Intent</p>
                            <p>By using Temporary Email, you agree to use this service exclusively for legitimate, temporary testing and sign-up verifications.</p>
                            <p class="mt-2 font-bold mb-1 text-rose-500">Strict Anti-Fraud Policy</p>
                            <p>This app must <strong>NEVER</strong> be used for illegal activities, spamming, phishing, scamming, unauthorized access, bypassing security systems, or fraudulent impersonation of any individual or organization.</p>
                            <p class="mt-2">We maintain a zero-tolerance policy for malicious activity. Any misuse of this service that violates local or international laws is strictly prohibited.</p>
                        </div>
                    </div>
                </div>
            ` : '';

            root.innerHTML = `
                <div class="w-full min-h-screen sm:min-h-0 app-shell sm:rounded-3xl sm:shadow-xl sm:border p-4 sm:p-6 flex flex-col flex-grow justify-between">
                    <div>
                        <!-- Header -->
                        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
                                    <i data-lucide="mail" class="w-4 h-4"></i>
                                </div>
                                <!-- Header -->
            <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <h1 class="font-bold text-base tracking-tight text-main">Temporary Email</h1>
                </div>
            </div>

                        <!-- Email Card -->
                        <div class="mt-6 custom-box rounded-2xl p-4 border text-center">
                            <p class="text-[11px] font-semibold uppercase tracking-wider text-sub">Your Temp Address</p>
                            <div class="mt-1 flex items-center justify-center gap-2">
                                <span class="font-mono font-bold text-sm sm:text-base text-blue-600 select-all truncate max-w-[220px] sm:max-w-[260px]">${s.email || 'Generating...'}</span>
                                <button onclick="copyEmail()" class="p-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700 shadow-sm transition-colors">
                                    <i data-lucide="copy" class="w-4 h-4"></i>
                                </button>
                            </div>
                            <div class="mt-3 flex items-center justify-between text-xs pt-3 border-t border-slate-200/60 text-sub">
                                <span id="timerDisplay" class="font-medium">${timeStr} left</span>
                                <button onclick="initEmail()" class="flex items-center gap-1 font-bold text-blue-600 hover:underline">
                                    <i data-lucide="refresh-cw" class="w-3 h-3"></i> New address
                                </button>
                            </div>
                        </div>

                        <!-- Inbox Section -->
                        <div class="mt-6 flex flex-col h-[280px] sm:h-[220px]">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-2 text-xs font-bold text-sub uppercase tracking-wider">
                                    <i data-lucide="inbox" class="w-4 h-4"></i> Inbox
                                </div>
                                <button onclick="fetchMessages()" class="text-xs font-semibold text-blue-600 hover:underline flex items-center gap-1">
                                    <i data-lucide="rotate-cw" class="w-3 h-3"></i> Check now
                                </button>
                            </div>
                            <div class="custom-box rounded-2xl border p-3 flex-grow overflow-y-auto">
                                ${inboxContent}
                            </div>
                        </div>
                    </div>

                    <!-- Footer Links -->
                    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-sub font-medium">
                        <button onclick="s.showPrivacy=true;render();" class="hover:underline">Privacy Policy</button>
                        <button onclick="s.showTerms=true;render();" class="hover:underline">Terms of Service</button>
                    </div>
                </div>
                ${messageModal}
                ${privacyHtml}
                ${termsHtml}
            `;

            lucide.createIcons();
        }

        window.onload = () => {
            initEmail();
            setInterval(fetchMessages, 10000);
        };
    </script>
</body>
</html>
