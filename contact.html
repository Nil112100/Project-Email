<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Temporary Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200 shadow-sm px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="text-xl font-bold text-blue-600">📧 Temporary Email</a>
        <div class="space-x-4">
            <a href="index.html" class="text-sm font-medium hover:text-blue-600">Home</a>
            <a href="privacy.html" class="text-sm font-medium hover:text-blue-600">Privacy</a>
            <a href="terms.html" class="text-sm font-medium hover:text-blue-600">Terms</a>
            <a href="about.html" class="text-sm font-medium hover:text-blue-600">About</a>
            <a href="contact.html" class="text-sm font-medium text-blue-600">Contact</a>
        </div>
    </nav>

    <!-- Content -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-2xl">
        <h1 class="text-3xl font-bold mb-2">Contact Us</h1>
        <p class="text-gray-600 mb-8">Have a question or need support? Fill out the form below and we will get back to you as soon as possible.</p>
        
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
            <form action="#" method="POST" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"></textarea>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        &copy; 2026 Temporary Email. All rights reserved.
    </footer>

</body>
</html>
