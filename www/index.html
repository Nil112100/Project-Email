<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Temporary Email</title>
  
  <!-- Compiled Local Tailwind CSS -->
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
  
  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 text-center shadow-md">
    <h1 class="text-xl font-bold text-indigo-400">✉️ Temp Email Generator</h1>
  </header>

  <!-- Main Container -->
  <main class="flex-1 p-4 max-w-md mx-auto w-full flex flex-col gap-4">
    
    <!-- Email Address Box -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col gap-3">
      <label class="text-xs uppercase font-semibold text-slate-400">Your Temporary Address</label>
      <div class="flex items-center gap-2">
        <input 
          id="email-address" 
          type="text" 
          readonly 
          value="Generating..." 
          class="flex-1 bg-slate-900 text-indigo-300 font-mono text-sm px-3 py-2 rounded-lg border border-slate-700 focus:outline-none"
        />
        <button 
          onclick="copyEmail()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition active:scale-95">
          Copy
        </button>
      </div>
      <button 
        onclick="generateNewEmail()" 
        class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium py-2 rounded-lg transition">
        🔄 Generate New Email
      </button>
    </div>

    <!-- Inbox Section -->
    <div class="flex-1 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col min-h-[300px]">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-300">Inbox</h2>
        <button 
          onclick="checkInbox()" 
          class="text-xs text-indigo-400 hover:underline">
          Refresh Inbox
        </button>
      </div>

      <!-- Message List -->
      <div id="inbox-list" class="flex-1 overflow-y-auto space-y-2">
        <p class="text-xs text-slate-500 text-center py-8">Waiting for incoming emails...</p>
      </div>
    </div>

  </main>

  <script>
    let currentEmail = '';

    async function generateNewEmail() {
      const emailInput = document.getElementById('email-address');
      emailInput.value = 'Generating...';
      
      try {
        const res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
        const data = await res.json();
        currentEmail = data[0];
        emailInput.value = currentEmail;
        checkInbox();
      } catch (err) {
        emailInput.value = 'demo-user@1secmail.com';
        currentEmail = 'demo-user@1secmail.com';
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('email-address');
      if (!emailInput.value || emailInput.value === 'Generating...') return;
      
      navigator.clipboard.writeText(emailInput.value);
      alert('Copied email address!');
    }

    async function checkInbox() {
      const inboxList = document.getElementById('inbox-list');
      if (!currentEmail || currentEmail === 'Generating...') return;

      const [username, domain] = currentEmail.split('@');
      
      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${username}&domain=${domain}`);
        const messages = await res.json();

        if (messages.length === 0) {
          inboxList.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">No emails received yet.</p>';
          return;
        }

        inboxList.innerHTML = messages.map(msg => `
          <div class="p-3 bg-slate-900 rounded-lg border border-slate-700 text-xs">
            <div class="font-bold text-indigo-300">${msg.from}</div>
            <div class="text-slate-200 mt-1">${msg.subject}</div>
            <div class="text-slate-500 text-[10px] mt-1">${msg.date}</div>
          </div>
        `).join('');

      } catch (err) {
        inboxList.innerHTML = '<p class="text-xs text-red-400 text-center py-4">Failed to check inbox.</p>';
      }
    }

    // Generate address on page load
    generateNewEmail();
  </script>
</body>
</html>
