<!DOCTYPE html>
<html lang="en" id="htmlRoot" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TempMail Pro | Instant Secure Disposable Email</title>
    <meta name="description" content="Free secure temporary email service. Protect your privacy, stop spam, and manage disposable mailboxes in real-time. Fast, reliable, and anonymous.">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style>
        .app-shell { max-width: 500px; margin: 0 auto; }
        .skeleton { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        /* Custom scrollbar for mobile */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 font-sans">
    
    <main class="app-shell p-4 sm:p-6 min-h-screen flex flex-col">
        
        <!-- Header Section -->
        <header class="flex items-center justify-between pb-6 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-2xl bg-blue-600 text-white flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <h1 class="font-bold text-lg tracking-tight">TempMail Pro</h1>
            </div>
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-all" aria-label="Toggle Dark Mode">
                <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- Dynamic Content Wrapper -->
        <div id="appContainer" class="flex-grow py-6 space-y-6">
            
            <!-- Home View -->
            <section id="homeView" class="space-y-6">
                <!-- Address Card -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm">
                    <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2">Disposable Address</p>
                    <div class="flex items-center gap-3 bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-100 dark:border-slate-800">
                        <span id="emailText" class="font-mono font-bold text-sm text-blue-600 dark:text-blue-400 truncate flex-grow">Loading...</span>
                        <button onclick="copyEmail()" class="p-2 hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg text-blue-600 transition-colors" aria-label="Copy email address">
                            <i data-lucide="copy" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="mt-4 flex items-center justify-between text-xs font-medium text-slate-500">
                        <span id="timerDisplay" class="flex items-center gap-1.5"><i data-lucide="clock" class="w-3 h-3"></i> --:-- left</span>
                        <button onclick="initEmail()" class="text-blue-600 hover:underline flex items-center gap-1.5">
                            <i data-lucide="refresh-cw" class="w-3 h-3"></i> Refresh
                        </button>
                    </div>
                </div>

                <!-- Inbox -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold">Inbox</h2>
                        <span id="mailCount" class="px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-800 text-[10px] font-bold">0</span>
                    </div>
                    <div id="inboxContainer" class="min-h-[200px] border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-3xl flex flex-col items-center justify-center text-center p-6 text-slate-400">
                        <i data-lucide="inbox" class="w-10 h-10 mb-3 opacity-50"></i>
                        <p class="text-sm">Waiting for incoming mail...</p>
                    </div>
                </div>

                <!-- Content Value Section (Crucial for AdSense) -->
                <div class="mt-8 p-4 rounded-2xl bg-blue-50 dark:bg-blue-900/10 border border-blue-100 dark:border-blue-900/20 text-sm text-blue-800 dark:text-blue-200">
                    <p class="font-bold mb-1">Why use TempMail?</p>
                    <p class="opacity-80">Use our service to bypass sign-up forms, avoid spam, and keep your primary inbox clean. Your data is never stored permanently.</p>
                </div>
            </section>

            <!-- Detail View -->
            <section id="messageView" class="hidden space-y-4">
                <button onclick="switchView('home')" class="flex items-center gap-1 text-sm text-slate-500 hover:text-blue-600">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i> Back to inbox
                </button>
                <div class="bg-white dark:bg-slate-900 p-5 rounded-3xl border border-slate-200 dark:border-slate-800">
                    <p id="msgFrom" class="text-[10px] font-bold uppercase tracking-wider text-slate-400"></p>
                    <h2 id="msgSubject" class="text-lg font-bold mt-1"></h2>
                    <div id="msgBody" class="mt-4 prose dark:prose-invert max-w-none text-sm leading-relaxed"></div>
                </div>
            </section>
        </div>

        <!-- Footer -->
        <footer class="text-center pt-8 border-t border-slate-200 dark:border-slate-800">
            <div class="flex justify-center gap-6 text-xs text-slate-500 mb-4">
                <button onclick="switchView('privacy')" class="hover:text-blue-600">Privacy</button>
                <button onclick="switchView('terms')" class="hover:text-blue-600">Terms</button>
                <button onclick="switchView('faq')" class="hover:text-blue-600">FAQ</button>
            </div>
            <p class="text-[10px] text-slate-400">© 2026 TempMail Pro. Secure & Anonymous.</p>
        </footer>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-6 right-6 p-4 rounded-xl bg-slate-900 text-white shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none text-center text-sm font-medium z-50"></div>

    <script>
        let state = { email: '', token: '', messages: [], timeLeft: 600 };
        let pollInterval = null;

        // Custom Toast UI
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.replace('translate-y-20', 'translate-y-0');
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-20');
                toast.classList.replace('opacity-100', 'opacity-0');
            }, 2000);
        }

        // Dark Mode Logic
        function toggleDarkMode() {
            document.getElementById('htmlRoot').classList.toggle('dark');
            const isDark = document.getElementById('htmlRoot').classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            lucide.createIcons();
        }

        // Navigation
        function switchView(view) {
            document.getElementById('homeView').classList.toggle('hidden', view !== 'home');
            document.getElementById('messageView').classList.toggle('hidden', view !== 'message');
            // Add logical routing here for privacy/terms...
            lucide.createIcons();
        }

        async function initEmail() {
            const container = document.getElementById('inboxContainer');
            container.innerHTML = '<p class="text-sm">Creating secure inbox...</p>';
            
            try {
                const dom = await fetch('https://api.mail.tm/domains').then(r => r.json());
                const email = 'u' + Math.random().toString(36).substring(7) + '@' + dom['hydra:member'][0].domain;
                const password = Math.random().toString(36).substring(2);
                
                // Account creation
                const acc = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: email, password })
                });
                
                if (acc.ok) {
                    const token = await fetch('https://api.mail.tm/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address: email, password })
                    }).then(r => r.json());
                    
                    state = { email, token: token.token, messages: [], timeLeft: 600 };
                    document.getElementById('emailText').innerText = email;
                    renderInbox();
                    startPolling();
                }
            } catch (e) {
                container.innerHTML = '<p class="text-red-500">Service temporarily unavailable.</p>';
            }
        }

        function renderInbox() {
            const container = document.getElementById('inboxContainer');
            document.getElementById('mailCount').innerText = state.messages.length;
            
            if (state.messages.length === 0) {
                container.innerHTML = '<div class="text-center"><i data-lucide="inbox" class="w-10 h-10 mb-2 opacity-50 mx-auto"></i><p>Waiting for mail...</p></div>';
            } else {
                container.innerHTML = '<div class="w-full divide-y divide-slate-100">' + state.messages.map(m => `
                    <div onclick="openMessage('${m.id}')" class="p-3 hover:bg-slate-50 cursor-pointer text-left">
                        <p class="text-xs font-bold">${m.from.address}</p>
                        <p class="text-sm truncate">${m.subject}</p>
                    </div>
                `).join('') + '</div>';
            }
            lucide.createIcons();
        }

        async function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (!state.token) return;
                const res = await fetch('https://api.mail.tm/messages', { headers: { 'Authorization': `Bearer ${state.token}` } }).then(r => r.json());
                if (res['hydra:member']) {
                    state.messages = res['hydra:member'];
                    renderInbox();
                }
            }, 5000);
        }

        function copyEmail() {
            navigator.clipboard.writeText(state.email);
            showToast('Address copied to clipboard!');
        }

        // Initialize App
        window.onload = () => {
            lucide.createIcons();
            initEmail();
        };
    </script>
</body>
</html>
