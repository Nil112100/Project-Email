<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Flash Mail</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body id="app-body" class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-300">

  <!-- Top Header -->
  <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 py-3 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-md shadow-indigo-500/20">
        <i class="fa-solid fa-bolt text-base text-white"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold text-slate-900 dark:text-white leading-tight">Flash Mail</h1>
        <p class="text-[10px] text-slate-500 dark:text-slate-400 font-medium">Disposable Email</p>
      </div>
    </div>

    <!-- Right Header Controls: Light/Dark Mode Switcher -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 bg-slate-200/70 dark:bg-slate-800 p-1 rounded-full border border-slate-300/50 dark:border-slate-700">
        <i class="fa-solid fa-sun text-xs text-amber-500 ml-1.5"></i>
        <button 
          id="theme-toggle" 
          onclick="toggleTheme()" 
          class="w-10 h-5 bg-slate-300 dark:bg-indigo-600 rounded-full p-0.5 transition-colors relative flex items-center focus:outline-none">
          <div id="toggle-circle" class="w-4 h-4 bg-white rounded-full shadow-md transform transition-transform duration-200 ease-in-out translate-x-0 dark:translate-x-5"></div>
        </button>
        <i class="fa-solid fa-moon text-xs text-slate-400 dark:text-indigo-300 mr-1.5"></i>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col gap-3.5">

    <!-- Email Generator Card -->
    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <label class="text-[11px] font-bold tracking-wider text-slate-400 dark:text-slate-500 uppercase flex items-center gap-1.5">
          <i class="fa-regular fa-envelope text-indigo-500"></i> Your Temp Address
        </label>
        <span id="status-badge" class="inline-flex items-center gap-1 text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Active
        </span>
      </div>

      <!-- Input + Copy Button -->
      <div class="relative flex items-center">
        <input 
          id="email-input" 
          type="text" 
          readonly 
          value="Generating..." 
          class="w-full bg-slate-50 dark:bg-slate-950 text-indigo-600 dark:text-indigo-300 font-mono text-xs pl-3 pr-20 py-3 rounded-xl border border-slate-200 dark:border-slate-800 focus:outline-none shadow-inner"
        />
        <button 
          id="copy-btn"
          onclick="copyEmail()" 
          class="absolute right-1.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-semibold text-xs px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-sm">
          <i class="fa-regular fa-copy text-xs"></i> <span id="copy-text">Copy</span>
        </button>
      </div>

      <!-- Generate New Email Button -->
      <button 
        onclick="generateNewEmail()" 
        class="w-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700/80 active:scale-[0.99] text-slate-700 dark:text-slate-200 font-semibold text-xs py-2.5 rounded-xl border border-slate-200/80 dark:border-slate-700 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrows-rotate text-slate-400"></i> Generate New Address
      </button>
    </div>

    <!-- Ad Banner Space Placeholder -->
    <div class="w-full bg-slate-200/60 dark:bg-slate-900/60 border border-dashed border-slate-300 dark:border-slate-800 rounded-xl p-2.5 flex items-center justify-center gap-2 text-slate-400 dark:text-slate-600 text-[11px] font-medium">
      <i class="fa-solid fa-rectangle-ad text-slate-400 dark:text-slate-500 text-sm"></i>
      <span>Ad Space — Banner Advertisement</span>
    </div>

    <!-- Inbox Card -->
    <div class="flex-1 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col min-h-[280px]">
      <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-inbox text-indigo-500"></i>
          <h2 class="text-xs font-bold text-slate-800 dark:text-slate-200">Inbox</h2>
        </div>
        <button 
          onclick="checkInbox()" 
          class="text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline font-medium flex items-center gap-1">
          <i class="fa-solid fa-arrows-rotate text-[10px]" id="refresh-icon"></i> Refresh
        </button>
      </div>

      <!-- Messages List -->
      <div id="inbox-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
        <div class="h-full flex flex-col items-center justify-center text-center p-6">
          <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-2">
            <i class="fa-regular fa-paper-plane text-lg"></i>
          </div>
          <p class="text-xs font-medium text-slate-500 dark:text-slate-400">Waiting for incoming emails...</p>
          <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-1">Auto-refreshing every 10 seconds.</p>
        </div>
      </div>
    </div>

  </main>

  <!-- Email Reading Modal (Popup) -->
  <div id="email-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white dark:bg-slate-900 w-full max-w-md rounded-t-2xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl overflow-hidden max-h-[85vh] flex flex-col">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-950">
        <h3 id="modal-subject" class="font-bold text-sm text-slate-800 dark:text-slate-100 truncate pr-2">Subject</h3>
        <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-500 flex items-center justify-center text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 text-xs text-slate-500 dark:text-slate-400 flex flex-col gap-1">
        <div><strong>From:</strong> <span id="modal-from" class="text-indigo-600 dark:text-indigo-400">---</span></div>
        <div><strong>Date:</strong> <span id="modal-date">---</span></div>
      </div>
      <div id="modal-body" class="p-4 overflow-y-auto text-xs text-slate-700 dark:text-slate-300 leading-relaxed space-y-2 flex-1">
        Loading email content...
      </div>
    </div>
  </div>

  <!-- Footer Links: Privacy Policy & Terms of Service -->
  <footer class="py-3 border-t border-slate-200/80 dark:border-slate-800/80 text-center text-[11px] text-slate-400 dark:text-slate-500 flex justify-center gap-4">
    <a href="privacy.html" target="_blank" class="hover:text-indigo-500 transition-colors">Privacy Policy</a>
    <span>•</span>
    <a href="#" onclick="alert('Terms of Service: This disposable email service is provided as-is for temporary testing purposes.')" class="hover:text-indigo-500 transition-colors">Terms & Conditions</a>
  </footer>

  <script>
    let currentEmail = '';

    // Theme Switcher (Starts in Light Mode)
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    // Set initial mode to Light
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Generate Email via 1secmail API
    async function generateNewEmail() {
      const emailInput = document.getElementById('email-input');
      emailInput.value = 'Generating...';
      
      try {
        const res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
        const data = await res.json();
        currentEmail = data[0];
        emailInput.value = currentEmail;
        checkInbox();
      } catch (err) {
        // Fallback domain if API call fails
        const randomName = 'user' + Math.floor(Math.random() * 89999 + 10000);
        currentEmail = `${randomName}@1secmail.com`;
        emailInput.value = currentEmail;
        checkInbox();
      }
    }

    function copyEmail() {
      const emailInput = document.getElementById('email-input');
      const copyBtn = document.getElementById('copy-btn');
      const copyText = document.getElementById('copy-text');
      
      if (!emailInput.value || emailInput.value === 'Generating...') return;

      navigator.clipboard.writeText(emailInput.value);
      copyText.textContent = 'Copied!';
      copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
      
      setTimeout(() => {
        copyText.textContent = 'Copy';
        copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
      }, 2000);
    }

    async function checkInbox() {
      const inboxList = document.getElementById('inbox-list');
      const refreshIcon = document.getElementById('refresh-icon');
      if (!currentEmail || currentEmail === 'Generating...') return;

      refreshIcon.classList.add('fa-spin');
      const [username, domain] = currentEmail.split('@');
      
      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${username}&domain=${domain}`);
        const messages = await res.json();

        if (!messages || messages.length === 0) {
          inboxList.innerHTML = `
            <div class="h-full flex flex-col items-center justify-center text-center p-6">
              <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-2">
                <i class="fa-regular fa-paper-plane text-lg"></i>
              </div>
              <p class="text-xs font-medium text-slate-500 dark:text-slate-400">No emails received yet.</p>
              <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-1">Auto-refreshing every 10 seconds.</p>
            </div>`;
        } else {
          inboxList.innerHTML = messages.map(msg => `
            <div onclick="openEmail('${msg.id}')" class="p-3 bg-slate-50 hover:bg-slate-100 dark:bg-slate-950 dark:hover:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-800 transition-all cursor-pointer">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-xs text-indigo-600 dark:text-indigo-400 truncate max-w-[170px]">${msg.from}</span>
                <span class="text-[10px] text-slate-400">${msg.date}</span>
              </div>
              <div class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate">${msg.subject || '(No Subject)'}</div>
            </div>
          `).join('');
        }
      } catch (err) {
        inboxList.innerHTML = `
          <div class="text-center py-6">
            <p class="text-xs text-slate-500 dark:text-slate-400">Inbox ready. Waiting for new messages...</p>
          </div>`;
      } finally {
        setTimeout(() => refreshIcon.classList.remove('fa-spin'), 500);
      }
    }

    async function openEmail(msgId) {
      const [username, domain] = currentEmail.split('@');
      document.getElementById('email-modal').classList.remove('hidden');
      document.getElementById('modal-body').textContent = 'Loading content...';

      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${username}&domain=${domain}&id=${msgId}`);
        const mail = await res.json();
        
        document.getElementById('modal-subject').textContent = mail.subject || '(No Subject)';
        document.getElementById('modal-from').textContent = mail.from;
        document.getElementById('modal-date').textContent = mail.date;
        document.getElementById('modal-body').innerHTML = mail.htmlBody || mail.textBody || 'No text body available.';
      } catch (err) {
        document.getElementById('modal-body').textContent = 'Failed to load email message details.';
      }
    }

    function closeModal() {
      document.getElementById('email-modal').classList.add('hidden');
    }

    // Initialize
    generateNewEmail();
    setInterval(checkInbox, 10000);
  </script>
</body>
</html>
